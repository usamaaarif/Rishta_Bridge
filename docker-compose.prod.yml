version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rishtabridge-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rishtabridge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rishtabridge-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rishtabridge-backend-prod
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-rishtabridge}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_key}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://shadi.org.uk,https://www.shadi.org.uk}
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: rishtabridge-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  pgdata_prod:
  redisdata_prod:
  uploads_prod:
